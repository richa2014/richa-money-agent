name: Hunter-22 Health Monitoring

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:
  push:
    paths:
      - 'health_checks/hunter_22_health.py'
      - '.github/workflows/hunter-22-health.yml'

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run hunter-22 health check
      run: |
        python health_checks/hunter_22_health.py > health_report.json
        echo "Health check completed"
    
    - name: Check for regressions
      if: always()
      run: |
        python -c "
        import json
        with open('health_report.json') as f:
            report = json.load(f)
        if report['current_status'].get('regression_detected'):
            print('::error::Hunter-22 regression detected!')
            exit(1)
        "
    
    - name: Upload health report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: hunter-22-health-report
        path: health_report.json
