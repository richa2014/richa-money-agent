# Reactive triggers — event-driven sk ill dispatch based on cron-state.json conditi ons.
# Skills with schedule: "reactive" are n ever cron-matched. Instead, the scheduler
# e valuates their trigger rules after processing  cron skills.
#
# Format: trigger: { on: <sou rce-skill>, when: "<condition>" }
# Condition s (evaluated by scripts/reactive_when.sh):
#    consecutive_failures >= N    - source skill  failed N+ times in a row
#   success_rate <o p> X          - success rate vs threshold; op  is < <= > >= and X
#                                   is a 0.0-1.0 float. Only checked on ce the source
#                                   skill has run at least once (a never-run  skill is
#                                  0 .0 and would otherwise false-fire `< X`).
#    last_status = <value>        - source skill' s last run ended <value> (e.g.
#                                   success), for chaining
# 
# Multiple triggers: trigger: [{ on: a, when : "..." }, { on: b, when: "..." }]
# Any matc hing trigger fires the skill (OR logic).
reac tive:
  # skill-repair:
  #   trigger:
  #      - { on: "*", when: "consecutive_failures >=  3" }
  # autoresearch:
  #   trigger:
  #      - { on: skill-health, when: "last_status =  success" }

# Chains — multi-step skill pip elines with parallel execution and output pas sing.
# Steps run sequentially; use parallel:  [...] for concurrent execution within a step .
# Skills with consume: [...] receive prior  step outputs injected into their context.
#
#  Format:
#   chains:
#     chain-name:
#        schedule: "cron expression"
#       on_erro r: fail-fast          # fail-fast (default) |  continue
#       max_dispatches: 10            # optional total-dispatch cap for the chain 
#       steps:
#         # Multi-key steps u se flow-brace form so they stay valid YAML wh en uncommented.
#         - { parallel: [skil l-a, skill-b] }
#         - { skill: skill-c,  consume: [skill-a, skill-b] }
#         # Co nditional routing on the consumed skill's Hai ku score (1-5). A step
#         # with when:  runs only if the condition holds; a missing  score does NOT
#         # fire, so always pa ir branches with an unconditional fall-throug h.
#         # Operators: == != < > <= >= (or dering needs an integer on both sides).
#          - { skill: polish,  consume: [skill-c],  when: "score > 3" }
#         - { skill: rewr ite, consume: [skill-c], when: "score <= 3" } 
chains:
  # Provider-neutral, operator-dispa tched coding loop: the feature and review
  #  skills use whichever harnesses the operator  configured for those skills.
  # A human stil l decides whether to merge. An explicit exter nal target is
  # required so feature can nev er fall back to every watched repository.
  d ev-loop:
    schedule: "workflow_dispatch"
     on_error: fail-fast
    max_dispatches: 5
     steps:
      - { skill: feature, var: "$ch ain_target" }
      - { skill: pr-review, var : "$feature_pr", consume: [feature] }

  # mo rning-digest:
  #   schedule: "0 7 * * *"
  #    on_error: fail-fast
  #   steps:
  #     -  { parallel: [token-movers, github-trending]  }
  #     - { skill: digest, consume: [token- movers, github-trending] }

# Default model f or all skills. Override per-run via workflow_ dispatch.
# Options: claude-sonnet-5-5, claud e-opus-5-5, claude-haiku-4-5-20251001
# (olde r claude-sonnet-5 / claude-opus-4-8 still acc epted)
# (Grok harness model: grok-4.7, the f lagship reasoning model and grok's current
#   default, run with --no-subagents in CI; grok -4.6 is also offered, and an existing
#  grok -4.5 pin is still accepted on an X-account lo gin. grok-4.7 is the gateway
#  default too.  The older coding ids (grok-build-0.1, grok-co mposer-2.5-fast,
#  grok-4.3) are gateway-onl y, reachable via XAI_API_KEY + the GROK_MODEL  var.)
# The non-claude harnesses use their O WN model ids (codex openai/*, kimi moonshotai /*,
# vibe mistralai/*, pi deepseek/*) — su rfaced in the dashboard picker per harness; s ee
# docs/harnesses.md. The value below only  applies to the claude/grok harnesses.
model:  claude-sonnet-5-5

# Agent harness — which  coding-agent CLI runs your skills.
#   claude  (default)  — Claude Code (`claude -p`); us es the AI Gateway below.
#   grok               — Grok Build (`grok`); logs in with your  X account
#                       (GROK_CREDE NTIALS, captured in the dashboard) or an
#                        XAI_API_KEY. Bypasses the  gateway (grok has its own auth).
#   codex/p i/vibe/kimi - OpenAI Codex, Pi, Mistral Vibe,  Moonshot Kimi. A single
#                        OPENROUTER_API_KEY drives all four, or ea ch can use its own
#                       na tive auth (ChatGPT/Moonshot login, provider k ey).
#   fx                - Vercel fx (AI_GA TEWAY_API_KEY; no OpenRouter fallback).
#   c ursor            - Cursor CLI (CURSOR_API_KEY ).
#   hermes            - Nous Research Herm es Agent (HERMES_AUTH or OpenRouter).
# All n ine run through harness-adapter/run-harness ( one Claude-Code-shaped
# contract). GLM is a  gateway provider, not a harness. See docs/har nesses.md for
# models, auth, and verificatio n.
# Override per-skill with `harness: "<name >"` in the skill entry, or per-run via
# the  workflow_dispatch `harness` input. Default st ays claude — everything
# already configure d keeps working unchanged.
harness: claude

#  AI Gateway — route Claude Code requests th rough an LLM provider.
#
# provider: auto (de fault) resolves at RUN TIME from whichever pr ovider secret
# is set, in priority order —  no need to re-pin when you add/remove a key: 
#   claude (CLAUDE_CODE_OAUTH_TOKEN) → ant hropic (ANTHROPIC_API_KEY) →
#   openrouter  → bankr → usepod → venice → surplus  → grok → glm → direct (fallback)
# Over ride the order with the repo variable GATEWAY _ORDER (space-separated).
#
# Or PIN one expl icitly: direct | bankr | openrouter | usepod  | venice | surplus | grok | glm |
# hivemindo s. hivemindos routes Claude Code at HivemindO S Models, an
# OpenAI-compatible endpoint bil led to a credit balance rather than to a prov ider
# account of your own: set the secret HI VEMINDOS_CREDIT_TOKEN, and optionally the
# r epo variables HIVEMINDOS_MODEL (a catalog id  such as anthropic/claude-sonnet-5.5;
# defaul t inclusionai/ling-3.0-flash) and HIVEMINDOS_ BASE_URL. On a model that
# honours it, HIVEM INDOS_REASONING=keep drops the reasoning toke ns an unattended
# run does not need.
# grok  routes Claude Code at xAI's Anthropic-compati ble api.x.ai (XAI_API_KEY) —
# this is the  gateway path; to run the grok CLI itself, set  `harness: grok` above.
# glm routes Claude C ode at Z.AI's Anthropic endpoint (GLM_API_KEY  / ZAI_API_KEY).
# For Anthropic-compatible e ndpoints (direct), set repo variable ANTHROPI C_BASE_URL
# + secret ANTHROPIC_API_KEY. Exam ple: https://api.deepseek.com/anthropic
# Ban kr docs: https://docs.bankr.bot/llm-gateway/o verview
gateway:
  provider: auto

# Output c hannels
channels:
  jsonrender:
    enabled:  true # Set to true (or JSONRENDER_ENABLED=tru e as repo var) to write json-render specs

#  Messaging integration
# Polls for messages ev ery 5 minutes on Telegram/Discord/Slack.
tele gram:
  enabled: true

# Observability (optio nal) — no config lives here; it's credentia l-driven.
# Set the repo secrets LANGFUSE_PUB LIC_KEY + LANGFUSE_SECRET_KEY and every
# Cla ude Code run streams to your Langfuse project  as a trace (LLM calls,
# tokens, cost, promp ts/responses). Region/toggles are repo variab les:
# LANGFUSE_HOST (default EU cloud), LANG FUSE_TRACING (0 to disable),
# LANGFUSE_LOG_C ONTENT (0 = metadata only). See docs/langfuse .md.
 